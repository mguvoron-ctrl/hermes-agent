{% extends "base.html" %}
{% block title %}Пользователи{% endblock %}
{% block content %}
<h1>Пользователи</h1>
<div class="card">
  <h2>Добавить коллегу</h2>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="/users">
    <div class="row">
      <div><label class="lbl">Логин</label><input type="text" name="username" required></div>
      <div><label class="lbl">Пароль</label><input type="text" name="password" required></div>
      <div style="flex:0 0 160px">
        <label class="lbl">Роль</label>
        <select name="role">
          <option value="user">Сотрудник</option>
          <option value="admin">Администратор</option>
        </select>
      </div>
    </div>
    <div style="height:12px"></div>
    <button class="btn" type="submit">Создать</button>
  </form>
</div>
<div class="card">
  <table>
    <tr><th>Логин</th><th>Роль</th><th>Создан</th></tr>
    {% for u in users %}
    <tr><td><b>{{ u.username }}</b></td><td>{{ u.role }}</td><td class="muted">{{ u.created_at }}</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
