<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Трекер поставок{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      /* бело-голубая современная палитра */
      --bg:#eef4fc; --card:#ffffff; --ink:#15233a; --muted:#64748b;
      --line:#e1e9f3; --line2:#eef3f9;
      --accent:#2563eb; --accent-2:#3b82f6; --accent-weak:#e6f0ff; --accent-ring:rgba(37,99,235,.22);
      --thead:#eef4fc; --thead-ink:#56657c; --thead-line:#d6e2f1;
      --hover:#f2f7fe;
      --ok:#15924f; --ok-bg:#e3f6ec;
      --work:#c67806; --work-bg:#fcf1dd;
      --wait:#8794a7; --wait-bg:#eef2f7;
      --danger:#e24a4a;
      --shadow:0 1px 2px rgba(20,40,80,.05),0 4px 14px rgba(20,50,100,.07);
      --shadow-lg:0 12px 28px rgba(20,50,110,.16);
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      font:15px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    }
    a{color:var(--accent); text-decoration:none}
    a:hover{text-decoration:underline}

    header.topbar{
      background:linear-gradient(105deg,#1e3a8a 0%,#2563eb 55%,#3b82f6 100%);
      color:#eaf2ff; padding:0 24px; height:60px;
      display:flex; align-items:center; gap:4px; position:sticky; top:0; z-index:10;
      box-shadow:0 2px 0 rgba(255,255,255,.08) inset, 0 6px 20px rgba(20,50,120,.28);
      border-bottom:1px solid rgba(255,255,255,.12);
    }
    .topbar .brand{font-weight:800; font-size:17px; margin-right:22px; color:#fff;
      letter-spacing:.01em; text-shadow:0 1px 1px rgba(0,0,0,.18)}
    .topbar nav a{
      color:#cfe0fb; padding:9px 14px; border-radius:10px; font-size:14px; font-weight:600;
      transition:background .12s,color .12s;
    }
    .topbar nav a:hover{background:rgba(255,255,255,.14); color:#fff; text-decoration:none}
    .topbar nav a.active{background:rgba(255,255,255,.95); color:#1e40af;
      box-shadow:0 2px 8px rgba(10,30,80,.22)}
    .topbar .spacer{flex:1}
    .topbar .who{color:#bcd2f5; font-size:13px; margin-right:12px}

    .wrap{max-width:1800px; margin:24px auto; padding:0 28px}
    .card{
      background:var(--card); border:1px solid var(--line); border-radius:14px;
      padding:20px 22px; margin-bottom:16px; box-shadow:var(--shadow);
    }
    h1{font-size:24px; font-weight:700; margin:0 0 4px; letter-spacing:-.015em}
    h2{font-size:16px; font-weight:650; margin:0 0 14px; letter-spacing:-.01em}
    .sub{color:var(--muted); margin:0 0 18px}
    .crumbs{color:var(--muted); font-size:13px; margin:0 0 12px}
    .crumbs a{color:var(--muted)} .crumbs a:hover{color:var(--accent)}

    /* таблицы */
    table{width:100%; border-collapse:collapse; font-size:14px}
    thead th{
      text-align:left; color:var(--thead-ink); font-weight:700; font-size:11.5px;
      text-transform:uppercase; letter-spacing:.04em; padding:12px 12px;
      background:var(--thead); border-bottom:2px solid var(--thead-line); white-space:nowrap;
    }
    tbody td{padding:12px; border-bottom:1px solid var(--line2); vertical-align:middle}
    tbody tr:last-child td{border-bottom:none}
    tr.clickable{cursor:pointer; transition:background .1s}
    tr.clickable:hover{background:var(--hover)}
    .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
    .mono{font-variant-numeric:tabular-nums}

    /* бейдж этапа */
    .badge{display:inline-block; padding:4px 11px; border-radius:999px; font-size:12.5px;
           font-weight:600; white-space:nowrap; line-height:1.3}
    .badge.ok{background:var(--ok-bg); color:var(--ok)}
    .badge.work{background:var(--work-bg); color:var(--work)}
    .badge.wait{background:var(--wait-bg); color:var(--wait)}
    .badge.accent{background:var(--accent-weak); color:var(--accent)}

    /* точки-этапы */
    .dots{display:inline-flex; gap:3px; align-items:center}
    .dots i{width:7px; height:7px; border-radius:50%; background:#d5e0ee; display:inline-block}
    .dots i.done{background:var(--ok)}
    .dots i.now{background:var(--accent); box-shadow:0 0 0 2px var(--accent-weak)}
    .steptxt{color:var(--muted); font-size:12.5px; margin-left:8px}

    /* формы */
    label.lbl{font-size:12.5px; color:var(--muted); display:block; margin-bottom:5px; font-weight:500}
    input[type=text],input[type=password],textarea,select{
      width:100%; padding:9px 11px; border:1px solid #ddd2c0; border-radius:10px;
      font:inherit; background:#fff; color:var(--ink); transition:border .12s,box-shadow .12s;
    }
    input:focus,textarea:focus,select:focus{
      outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-ring);
    }
    textarea{min-height:46px; resize:vertical}
    .btn{display:inline-block; background:linear-gradient(180deg,var(--accent-2),var(--accent));
         color:#fff; border:none; padding:9px 16px; border-radius:10px; font:inherit; font-weight:600;
         cursor:pointer; box-shadow:0 1px 2px rgba(120,75,25,.25); transition:filter .12s, transform .04s}
    .btn:hover{filter:brightness(1.06)}
    .btn:active{transform:translateY(1px)}
    .btn.sm{padding:6px 11px; font-size:13px; font-weight:600; border-radius:9px}
    .btn.ghost{background:#e9f1fc; color:var(--ink); box-shadow:none}
    .btn.ghost:hover{background:#dce8f8}
    .btn.danger{background:linear-gradient(180deg,#db5a52,var(--danger))}
    .row{display:flex; gap:12px; flex-wrap:wrap}
    .row>*{flex:1; min-width:150px}
    .muted{color:var(--muted)}
    .err{background:#fbe4e2; color:#b23a35; padding:10px 12px; border-radius:10px; margin-bottom:12px}
    .empty{color:var(--muted); padding:8px 2px}

    /* сетка "ключ-значение" */
    .kv{display:grid; grid-template-columns:210px 1fr}
    .kv>div{padding:10px 2px; border-bottom:1px solid var(--line2); display:flex}
    .kv>div:nth-last-child(-n+2){border-bottom:none}
    .kv .k{color:var(--muted)}
    @media(max-width:560px){ .kv{grid-template-columns:1fr} .kv .k{padding-bottom:0} }

    .scroll-x{overflow-x:auto; border:1px solid var(--line); border-radius:12px}
    .scroll-x table{margin:0}

    /* матрица этапов */
    .matrix{font-size:13px}
    .matrix thead th{padding:12px 10px; text-align:center; background:var(--thead);
      border-right:1px solid var(--line2); min-width:84px}
    .matrix tbody td{padding:13px 10px; text-align:center; border-right:1px solid var(--line2); min-width:84px}
    .matrix th:last-child,.matrix td:last-child{border-right:none}
    .matrix th.left,.matrix td.left{text-align:left; white-space:nowrap; min-width:170px}
    .matrix thead th.left{position:sticky; left:0; background:var(--thead); z-index:3}
    .matrix tbody td.left{position:sticky; left:0; background:var(--card); z-index:1; box-shadow:1px 0 0 var(--line)}
    .matrix tr.clickable:hover td{background:var(--hover)}
    .matrix tr.clickable:hover td.left{background:var(--hover)}
    .cell{display:inline-flex; align-items:center; justify-content:center;
          width:28px; height:28px; border-radius:8px; font-size:14px; font-weight:700}
    .cell.ok{background:var(--ok-bg); color:var(--ok)}
    .cell.now{background:var(--accent-weak); color:var(--accent)}
    .cell.wait{color:#c3cedd; font-weight:400}
    .legend{display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:12.5px; margin-top:12px}
    .legend span{display:inline-flex; align-items:center; gap:6px}

    /* полосатая таблица товаров + итоги + мягкая сетка ячеек */
    table.striped tbody tr:nth-child(odd){background:#f6f9ff}
    table.striped tbody tr:hover{background:var(--hover)}
    table.striped th, table.striped td{border-right:1px solid var(--line)}
    table.striped th:last-child, table.striped td:last-child{border-right:none}
    table.striped tbody td{border-bottom:1px solid var(--line); vertical-align:top}
    table.striped tfoot td{font-weight:700; border-top:2px solid #cfddf0;
      border-bottom:none; padding:13px 12px; background:#eef4fc}
    /* колонки таблицы товаров */
    .goods td, .goods th{min-width:66px}
    .goods td.nm-ru{min-width:230px; font-weight:500; color:var(--ink)}
    .goods td.muted{min-width:200px}
    .goods .mono{font-size:13px}
    /* подсветка проблем сверки (как в макросе Камьён) */
    td.c-bad{background:#fbe0dd !important}
    td.c-warn{background:#f9efcc !important}
    .pill.bad{background:#fbe0dd; color:#b23a35}
    .pill.warn{background:#f9efcc; color:#92641a}

    /* редактор таблицы товаров */
    .ed-grid{border-collapse:collapse; font-size:12.5px}
    .ed-grid th{background:var(--thead); color:var(--thead-ink); font-size:10.5px; text-transform:uppercase;
      letter-spacing:.03em; padding:7px 6px; border:1px solid var(--thead-line); white-space:nowrap}
    .ed-grid td{padding:2px; border:1px solid var(--line)}
    .ed-grid input{width:100%; min-width:70px; padding:5px 6px; border:1px solid transparent;
      border-radius:5px; font:inherit; font-size:12.5px; background:transparent}
    .ed-grid input:focus{outline:none; border-color:var(--accent);
      box-shadow:0 0 0 2px var(--accent-ring); background:#fff}
    .ed-grid input.wide{min-width:200px}
    .ed-grid td.ro{padding:5px 8px; color:#5b6b82; font-size:12.5px; white-space:nowrap; background:#f6f9ff}
    .ed-grid .rowdel{color:var(--danger); cursor:pointer; text-align:center; font-weight:700; user-select:none}
    /* строка «Итого» — выделена, чтобы отличалась от таблицы */
    .ed-grid tfoot td{background:var(--accent-weak); border-top:2px solid #b9ccea; font-weight:700;
      color:#26477c; padding:8px 8px; font-size:12.5px}
    .ed-grid tfoot td.tfoot-lab{text-align:right; text-transform:uppercase; letter-spacing:.04em;
      color:#4a5f86; font-size:11px}
    .ed-grid tfoot td.tfoot-val{text-align:left}
    .ed-hint{color:var(--muted); font-size:12.5px; margin:8px 0}

    /* сворачиваемые карточки (раскрывающийся список) */
    .card.collapsible > .card-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      cursor:pointer; user-select:none; margin:0}
    .card.collapsible > .card-head h2{margin:0}
    .card.collapsible > .card-head .chev{color:var(--muted); font-size:13px; transition:transform .18s ease;
      display:inline-block; width:14px; text-align:center}
    .card.collapsible.collapsed > .card-head .chev{transform:rotate(-90deg)}
    .card.collapsible > .card-body{overflow:hidden; transition:max-height .22s ease, opacity .18s ease,
      margin-top .18s ease; max-height:20000px; opacity:1; margin-top:12px}
    .card.collapsible.collapsed > .card-body{max-height:0; opacity:0; margin-top:0}
    .card.collapsible.collapsed{padding-bottom:16px}
    .card-head .cnt{font-weight:500; color:var(--muted)}
    .card-head .tag-collapsed{display:none; font-size:12px; color:var(--muted); margin-left:4px}
    .card.collapsible.collapsed .tag-collapsed{display:inline}

    /* плитки источников справочника */
    .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px}
    .tile{display:block; background:var(--card); border:1px solid var(--line); border-radius:14px;
      padding:16px 18px; text-decoration:none; color:var(--ink); box-shadow:var(--shadow);
      transition:transform .12s, box-shadow .12s, border-color .12s; position:relative; overflow:hidden}
    .tile:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg);
      border-color:#bcd2f5; text-decoration:none}
    .tile.active{border-color:var(--accent); background:linear-gradient(180deg,#eef5ff,#fff)}
    .tile .nm{display:flex; align-items:center; gap:7px; font-weight:650; font-size:14.5px}
    .tile .nm .ic{font-size:18px}
    .tile .num{font-size:30px; font-weight:800; letter-spacing:-.02em; margin-top:10px; line-height:1; color:var(--accent)}
    .tile .cnt{color:var(--muted); font-size:12.5px; margin-top:3px}
    .tile.transit{background:linear-gradient(180deg,#fdf4df,#fff); border-color:#ecdcb0}
    .tile.transit.active{background:linear-gradient(180deg,#fbecc6,#fff)}
    .tile .bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent)}
    .tile.transit .bar{background:#d9a53a}

    /* данные инвойса — таблица с ячейками (единый стиль с таблицей товаров) */
    table.info{width:100%; border-collapse:collapse; border:1px solid var(--line);
      border-radius:12px; overflow:hidden; table-layout:fixed}
    table.info td{border:1px solid var(--line); padding:12px 13px; font-size:14px;
      vertical-align:top; overflow-wrap:break-word}
    table.info td.k{background:var(--thead); color:var(--thead-ink); width:190px}
    table.info td.v{color:var(--ink)}
    @media(max-width:620px){
      table.info{table-layout:auto}
      table.info td.k{width:140px}
    }
    /* редактируемые поля «Данные инвойса» */
    table.info.info-ed td.v{padding:4px 6px}
    table.info.info-ed td.v input{width:100%; border:1px solid transparent; border-radius:7px;
      padding:7px 8px; font:inherit; font-size:14px; background:transparent; color:var(--ink)}
    table.info.info-ed td.v input:hover{border-color:var(--line)}
    table.info.info-ed td.v input:focus{outline:none; border-color:var(--accent);
      box-shadow:0 0 0 2px var(--accent-ring); background:#fff}
    .save-status{margin-left:6px}

    /* карточки этапов */
    .step{padding:12px 14px; border:1px solid var(--line); border-radius:12px; margin-bottom:9px;
      transition:border-color .12s, background .12s}
    .step.current{border-color:#c6d9f7; background:linear-gradient(180deg,#f3f8ff,#ffffff)}
    .step.done{background:#fbfdff}
    .step-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
    .step-head .nm{font-weight:650}
    .step-head .acts{margin-left:auto; display:flex; gap:6px}
    .step-note{color:var(--ink); margin-top:6px; font-size:13.5px}
    .step-note .lab{color:var(--muted)}
    .step-file{margin-top:7px; font-size:13px}
    .edit{margin-top:10px; display:none}
    .edit.open{display:block}
  </style>
</head>
<body>
  {% if user %}
  <header class="topbar">
    <span class="brand">📦 Трекер поставок</span>
    <nav>
      <a href="/" class="{{ 'active' if nav=='shipments' else '' }}">Поставки</a>
      <a href="/invoices" class="{{ 'active' if nav=='invoices' else '' }}">Все инвойсы</a>
      {% if user.role == 'admin' %}<a href="/references" class="{{ 'active' if nav=='references' else '' }}">Справочники</a>{% endif %}
      {% if user.role == 'admin' %}<a href="/users" class="{{ 'active' if nav=='users' else '' }}">Пользователи</a>{% endif %}
    </nav>
    <span class="spacer"></span>
    <span class="who">{{ user.name }}</span>
    <a href="/logout" style="color:#c4ccd8; font-size:14px; padding:8px 10px">Выйти</a>
  </header>
  {% endif %}
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>

  <script>
  // Перетаскивание широкой таблицы мышкой (зажал и тянешь влево-вправо)
  document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('.scroll-x').forEach(function(el){
      var down=false, moved=false, startX=0, startScroll=0;
      function scrollable(){ return el.scrollWidth > el.clientWidth + 2; }
      function refresh(){ el.style.cursor = scrollable() ? 'grab' : ''; }
      refresh(); window.addEventListener('resize', refresh);
      el.addEventListener('mousedown', function(e){
        if(!scrollable()) return;
        if(e.target.closest('input,select,textarea,button,a,.rowdel')) return; // не мешаем вводу
        down=true; moved=false; startX=e.pageX; startScroll=el.scrollLeft;
        el.style.cursor='grabbing';
      });
      window.addEventListener('mouseup', function(){
        if(down){ down=false; el.style.cursor = scrollable() ? 'grab' : ''; }
      });
      el.addEventListener('mousemove', function(e){
        if(!down) return;
        if(Math.abs(e.pageX-startX) > 4) moved=true;
        e.preventDefault();
        el.scrollLeft = startScroll - (e.pageX - startX);
      });
      // если двигали — не считаем это кликом по строке
      el.addEventListener('click', function(e){
        if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; }
      }, true);
    });
  });

  // Сворачиваемые карточки: клик по шапке сворачивает/разворачивает,
  // состояние запоминается в браузере (localStorage) по id карточки.
  document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('.card.collapsible').forEach(function(card){
      var head=card.querySelector('.card-head'); if(!head) return;
      var key='collapse:'+(card.id||'');
      try{ if(card.id && localStorage.getItem(key)==='1') card.classList.add('collapsed'); }catch(e){}
      head.addEventListener('click', function(e){
        if(e.target.closest('a,button,input,select,textarea')) return; // не мешаем кнопкам внутри шапки
        card.classList.toggle('collapsed');
        try{ if(card.id) localStorage.setItem(key, card.classList.contains('collapsed')?'1':'0'); }catch(e){}
      });
    });
  });
  </script>
</body>
</html>
