<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Трекер поставок{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f5f6f8; --card:#ffffff; --ink:#1b2430; --muted:#707b8a;
      --line:#e8ebef; --line2:#f0f2f5;
      --accent:#4263eb; --accent-weak:#eaefff;
      --ok:#15924f; --ok-bg:#e4f6ec;
      --work:#c67806; --work-bg:#fcf1dd;
      --wait:#8a94a2; --wait-bg:#eef1f4;
      --danger:#e24a4a;
      --shadow:0 1px 2px rgba(20,30,50,.04),0 2px 8px rgba(20,30,50,.05);
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      font:15px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    }
    a{color:var(--accent); text-decoration:none}
    a:hover{text-decoration:underline}

    header.topbar{
      background:#141c2b; color:#eef1f6; padding:0 20px; height:52px;
      display:flex; align-items:center; gap:4px; position:sticky; top:0; z-index:10;
    }
    .topbar .brand{font-weight:700; font-size:16px; margin-right:18px; color:#fff}
    .topbar nav a{
      color:#c4ccd8; padding:8px 12px; border-radius:8px; font-size:14px; font-weight:500;
    }
    .topbar nav a:hover{background:#1f293b; color:#fff; text-decoration:none}
    .topbar nav a.active{background:#2a3650; color:#fff}
    .topbar .spacer{flex:1}
    .topbar .who{color:#8995a6; font-size:13px; margin-right:12px}

    .wrap{max-width:1800px; margin:22px auto; padding:0 28px}
    .card{
      background:var(--card); border:1px solid var(--line); border-radius:12px;
      padding:20px; margin-bottom:16px; box-shadow:var(--shadow);
    }
    h1{font-size:23px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em}
    h2{font-size:16px; font-weight:650; margin:0 0 14px; letter-spacing:-.01em}
    .sub{color:var(--muted); margin:0 0 18px}
    .crumbs{color:var(--muted); font-size:13px; margin:0 0 12px}
    .crumbs a{color:var(--muted)} .crumbs a:hover{color:var(--accent)}

    /* таблицы */
    table{width:100%; border-collapse:collapse; font-size:14px}
    thead th{
      text-align:left; color:#525c6b; font-weight:700; font-size:11.5px;
      text-transform:uppercase; letter-spacing:.04em; padding:12px 12px;
      background:#eef2f7; border-bottom:2px solid #d7dde6; white-space:nowrap;
    }
    tbody td{padding:12px; border-bottom:1px solid var(--line2); vertical-align:middle}
    tbody tr:last-child td{border-bottom:none}
    tr.clickable{cursor:pointer}
    tr.clickable:hover{background:#fafbfe}
    .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
    .mono{font-variant-numeric:tabular-nums}

    /* бейдж этапа */
    .badge{display:inline-block; padding:4px 11px; border-radius:999px; font-size:12.5px;
           font-weight:600; white-space:nowrap; line-height:1.3}
    .badge.ok{background:var(--ok-bg); color:var(--ok)}
    .badge.work{background:var(--work-bg); color:var(--work)}
    .badge.wait{background:var(--wait-bg); color:var(--wait)}
    .badge.accent{background:var(--accent-weak); color:var(--accent)}

    /* точки-этапы */
    .dots{display:inline-flex; gap:3px; align-items:center}
    .dots i{width:7px; height:7px; border-radius:50%; background:#dfe3e9; display:inline-block}
    .dots i.done{background:var(--ok)}
    .dots i.now{background:var(--accent); box-shadow:0 0 0 2px var(--accent-weak)}
    .steptxt{color:var(--muted); font-size:12.5px; margin-left:8px}

    /* формы */
    label.lbl{font-size:12.5px; color:var(--muted); display:block; margin-bottom:5px; font-weight:500}
    input[type=text],input[type=password],textarea,select{
      width:100%; padding:9px 11px; border:1px solid #d9dee5; border-radius:9px;
      font:inherit; background:#fff; color:var(--ink); transition:border .12s,box-shadow .12s;
    }
    input:focus,textarea:focus,select:focus{
      outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak);
    }
    textarea{min-height:46px; resize:vertical}
    .btn{display:inline-block; background:var(--accent); color:#fff; border:none;
         padding:9px 16px; border-radius:9px; font:inherit; font-weight:600; cursor:pointer;
         transition:filter .12s}
    .btn:hover{filter:brightness(1.07)}
    .btn.sm{padding:6px 11px; font-size:13px; font-weight:500}
    .btn.ghost{background:#eef1f5; color:var(--ink)}
    .btn.danger{background:var(--danger)}
    .row{display:flex; gap:12px; flex-wrap:wrap}
    .row>*{flex:1; min-width:150px}
    .muted{color:var(--muted)}
    .err{background:#fdecee; color:#c0393e; padding:10px 12px; border-radius:9px; margin-bottom:12px}
    .empty{color:var(--muted); padding:8px 2px}

    /* сетка "ключ-значение" */
    .kv{display:grid; grid-template-columns:210px 1fr}
    .kv>div{padding:10px 2px; border-bottom:1px solid var(--line2); display:flex}
    .kv>div:nth-last-child(-n+2){border-bottom:none}
    .kv .k{color:var(--muted)}
    @media(max-width:560px){ .kv{grid-template-columns:1fr} .kv .k{padding-bottom:0} }

    .scroll-x{overflow-x:auto; border:1px solid var(--line); border-radius:11px}
    .scroll-x table{margin:0}

    /* матрица этапов */
    .matrix{font-size:13px}
    .matrix thead th{padding:12px 10px; text-align:center; background:#f6f9fc;
      border-right:1px solid var(--line2); min-width:84px}
    .matrix tbody td{padding:13px 10px; text-align:center; border-right:1px solid var(--line2); min-width:84px}
    .matrix th:last-child,.matrix td:last-child{border-right:none}
    .matrix th.left,.matrix td.left{text-align:left; white-space:nowrap; min-width:170px}
    .matrix thead th.left{position:sticky; left:0; background:#f6f9fc; z-index:3}
    .matrix tbody td.left{position:sticky; left:0; background:#fff; z-index:1; box-shadow:1px 0 0 var(--line)}
    .matrix tr.clickable:hover td{background:#f4f8ff}
    .matrix tr.clickable:hover td.left{background:#f4f8ff}
    .cell{display:inline-flex; align-items:center; justify-content:center;
          width:28px; height:28px; border-radius:8px; font-size:14px; font-weight:700}
    .cell.ok{background:var(--ok-bg); color:var(--ok)}
    .cell.now{background:var(--accent-weak); color:var(--accent)}
    .cell.wait{color:#ccd2da; font-weight:400}
    .legend{display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:12.5px; margin-top:12px}
    .legend span{display:inline-flex; align-items:center; gap:6px}

    /* полосатая таблица товаров + итоги + мягкая сетка ячеек */
    table.striped tbody tr:nth-child(odd){background:#fafbfd}
    table.striped tbody tr:hover{background:#eef4ff}
    table.striped th, table.striped td{border-right:1px solid #e7ebf0}
    table.striped th:last-child, table.striped td:last-child{border-right:none}
    table.striped tbody td{border-bottom:1px solid #e7ebf0; vertical-align:top}
    table.striped tfoot td{font-weight:700; border-top:2px solid #cfd6df;
      border-bottom:none; padding:13px 12px; background:#f1f4f8}
    /* колонки таблицы товаров */
    .goods td, .goods th{min-width:66px}
    .goods td.nm-ru{min-width:230px; font-weight:500; color:var(--ink)}
    .goods td.muted{min-width:200px}
    .goods .mono{font-size:13px}
    /* подсветка проблем сверки (как в макросе Камьён) */
    td.c-bad{background:#fde3e3 !important}
    td.c-warn{background:#fdf6da !important}
    .pill.bad{background:#fde3e3; color:#c0393e}
    .pill.warn{background:#fdf6da; color:#9a6a00}

    /* редактор таблицы товаров */
    .ed-grid{border-collapse:collapse; font-size:12.5px}
    .ed-grid th{background:#eef2f7; color:#525c6b; font-size:10.5px; text-transform:uppercase;
      letter-spacing:.03em; padding:7px 6px; border:1px solid #d7dde6; white-space:nowrap}
    .ed-grid td{padding:2px; border:1px solid #e6eaef}
    .ed-grid input{width:100%; min-width:70px; padding:5px 6px; border:1px solid transparent;
      border-radius:4px; font:inherit; font-size:12.5px; background:transparent}
    .ed-grid input:focus{outline:none; border-color:var(--accent);
      box-shadow:0 0 0 2px var(--accent-weak); background:#fff}
    .ed-grid input.wide{min-width:200px}
    .ed-grid .rowdel{color:var(--danger); cursor:pointer; text-align:center; font-weight:700; user-select:none}
    .ed-hint{color:var(--muted); font-size:12.5px; margin:8px 0}

    /* данные инвойса — таблица с ячейками (единый стиль с таблицей товаров) */
    table.info{width:100%; border-collapse:collapse; border:1px solid var(--line);
      border-radius:11px; overflow:hidden; table-layout:fixed}
    table.info td{border:1px solid #e7ebf0; padding:12px 13px; font-size:14px;
      vertical-align:top; overflow-wrap:break-word}
    table.info td.k{background:#eef2f7; color:#525c6b; width:190px}
    table.info td.v{color:var(--ink)}
    @media(max-width:620px){
      table.info{table-layout:auto}
      table.info td.k{width:140px}
    }

    /* карточки этапов */
    .step{padding:12px 14px; border:1px solid var(--line); border-radius:11px; margin-bottom:9px}
    .step.current{border-color:#c6d6ff; background:#f6f9ff}
    .step.done{background:#fbfdfb}
    .step-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
    .step-head .nm{font-weight:650}
    .step-head .acts{margin-left:auto; display:flex; gap:6px}
    .step-note{color:var(--ink); margin-top:6px; font-size:13.5px}
    .step-note .lab{color:var(--muted)}
    .step-file{margin-top:7px; font-size:13px}
    .edit{margin-top:10px; display:none}
    .edit.open{display:block}
  </style>
</head>
<body>
  {% if user %}
  <header class="topbar">
    <span class="brand">📦 Трекер поставок</span>
    <nav>
      <a href="/" class="{{ 'active' if nav=='shipments' else '' }}">Поставки</a>
      <a href="/invoices" class="{{ 'active' if nav=='invoices' else '' }}">Все инвойсы</a>
      {% if user.role == 'admin' %}<a href="/references" class="{{ 'active' if nav=='references' else '' }}">Справочники</a>{% endif %}
      {% if user.role == 'admin' %}<a href="/users" class="{{ 'active' if nav=='users' else '' }}">Пользователи</a>{% endif %}
    </nav>
    <span class="spacer"></span>
    <span class="who">{{ user.name }}</span>
    <a href="/logout" style="color:#c4ccd8; font-size:14px; padding:8px 10px">Выйти</a>
  </header>
  {% endif %}
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>

  <script>
  // Перетаскивание широкой таблицы мышкой (зажал и тянешь влево-вправо)
  document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('.scroll-x').forEach(function(el){
      var down=false, moved=false, startX=0, startScroll=0;
      function scrollable(){ return el.scrollWidth > el.clientWidth + 2; }
      function refresh(){ el.style.cursor = scrollable() ? 'grab' : ''; }
      refresh(); window.addEventListener('resize', refresh);
      el.addEventListener('mousedown', function(e){
        if(!scrollable()) return;
        if(e.target.closest('input,select,textarea,button,a,.rowdel')) return; // не мешаем вводу
        down=true; moved=false; startX=e.pageX; startScroll=el.scrollLeft;
        el.style.cursor='grabbing';
      });
      window.addEventListener('mouseup', function(){
        if(down){ down=false; el.style.cursor = scrollable() ? 'grab' : ''; }
      });
      el.addEventListener('mousemove', function(e){
        if(!down) return;
        if(Math.abs(e.pageX-startX) > 4) moved=true;
        e.preventDefault();
        el.scrollLeft = startScroll - (e.pageX - startX);
      });
      // если двигали — не считаем это кликом по строке
      el.addEventListener('click', function(e){
        if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; }
      }, true);
    });
  });
  </script>
</body>
</html>
